name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baraq_ci
          POSTGRES_USER: baraq_ci
          POSTGRES_PASSWORD: baraq_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baraq_ci -d baraq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-secret-key-not-for-production-use-please-do-not-reuse-anywhere'
      DATABASE_URL: 'postgres://baraq_ci:baraq_ci_password@localhost:5432/baraq_ci'
      REDIS_URL: 'locmem://'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      PUBLIC_API_BASE_URL: 'http://localhost:8000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/development.txt
            requirements/production.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt -r requirements/development.txt

      - name: Lint (ruff)
        run: ruff check apps config scripts

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity 2

      - name: Validate OpenAPI schema (no warnings allowed)
        run: python manage.py spectacular --file /tmp/schema.yaml --fail-on-warn

      - name: Release hygiene gate
        run: python scripts/validate_release.py
